<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #c0ded4; 
            font-family: 'Courier New', Courier, monospace; 
            color: #333;
        }
        .text-teal-custom {
            color: #5fb09f;
        }
        .bg-teal-custom {
            background-color: #5fb09f;
        }
        .border-teal-custom {
            border-color: #5fb09f;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">
     <img src="Pesquisa.png" width="900px" alt="erro">
    <main class="w-full max-w-4xl bg-white rounded-sm shadow-md p-8 relative flex-grow">
        <button class="absolute top-8 left-8 text-2xl text-gray-700 hover:text-gray-900"><a href="Dashboard.html">
            <i class="fas fa-reply"></i>
            </a>
        </button>
        <h1 class="text-center text-3xl font-bold mb-12 tracking-wide">EMPRÉSTIMO</h1>
        <div class="flex flex-col md:flex-row gap-8 mb-12">
            <div class="w-full md:w-1/3 flex flex-col">
                <div class="w-full aspect-[3/4] border-2 border-teal-custom rounded-md mb-4 bg-white"></div>
                <div class="space-y-2 text-sm uppercase font-bold tracking-tight mb-4">
                    <p>SITUAÇÃO: FORMADO</p>
                    <p>DEVOLVIDO: PENDENTE <span class="text-red-500">X</span></p>
                    <p>ESTADO DO LIVRO:NOVO</p>
                </div>

                <button class="bg-teal-custom text-white font-bold py-3 px-6 rounded-full w-max shadow-sm hover:opacity-90 transition-opacity text-xl flex items-center gap-2">
                    <i class="fas fa-plus"></i> Adicionar
                </button>
            </div>
            <div class="w-full md:w-2/3 flex flex-col text-lg space-y-3">
                <p><span class="uppercase">NOME:</span><input type="text" id="Nome" name="Nome"></p>
                <p><span class="uppercase">IDADE:</span><input type="text" id="Nome" name="Nome"></p>
                <p><span class="uppercase">TELEFONE:</span><input type="text" id="Nome" name="Nome"></p>
                <p><span class="uppercase">GMAIL:</span><input type="text" id="Nome" name="Nome"></p>
                <p><span class="uppercase">RN:</span><input type="text" id="Nome" name="Nome"></p>
                <p class="uppercase">AGENDAMENTO:</p><br><br><br>
                <div class="border border-gray-200 rounded-lg p-4 w-72 mt-2 shadow-sm font-sans text-sm">
                    </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-8 mb-16">
            
            <div class="w-full md:w-1/3">
                <div class="w-full aspect-[2/3] border-4 border-teal-custom rounded-3xl bg-white"></div>
            </div>

            <div class="w-full md:w-2/3 flex flex-col justify-start text-lg space-y-4 pt-4">
                <p><span class="uppercase">NOME DO LIVRO:</span> nome livro</p>
                <p><span class="uppercase">AUTOR:</span> autor</p>
                <p><span class="uppercase">DESCRIÇÃO:</span> breve descrição</p>
                <p><span class="uppercase">ESTADO:</span> novo</p>
                <p><span class="uppercase">EDITORA:</span> nome</p>

                <div class="pt-4">
                    <button class="bg-teal-custom text-white font-bold py-3 px-6 rounded-full shadow-sm hover:opacity-90 transition-opacity text-xl flex items-center gap-2">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center mt-8">
            <button class="bg-teal-custom text-white font-bold py-3 px-8 rounded-full shadow-sm hover:opacity-90 transition-opacity text-xl tracking-wide">
                CANCELAR
            </button>
            <button class="bg-teal-custom text-white font-bold py-3 px-8 rounded-full shadow-sm hover:opacity-90 transition-opacity text-xl tracking-wide">
                CONCLUIDO
            </button>
        </div>

    </main>

</body>
</html>
